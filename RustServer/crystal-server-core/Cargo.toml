[package]
name = "crystal-server-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
once_cell = "1"
crystal-shared-proto = { path = "../crystal-shared-proto" }
crystal-content-pack = { path = "../crystal-content-pack" }
rand = "0.8"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
